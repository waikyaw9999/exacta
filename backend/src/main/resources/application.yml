spring:
  application:
    name: exacta-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exacta}
    username: ${SPRING_DATASOURCE_USERNAME:exacta}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-in-production}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:replace-with-a-256-bit-secret-key-for-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173,http://127.0.0.1:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_SEED_ADMIN_EMAIL:ada@exacta.test}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:ExactaDemo1!}
    member-password: ${APP_SEED_MEMBER_PASSWORD:ExactaDemo1!}

