spring:
  datasource:
    url: jdbc:h2:mem:exacta;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: test-only-secret-key-must-be-at-least-32-chars
  expiration-ms: 3600000

app:
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: false
