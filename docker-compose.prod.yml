services:
  db:
    image: postgres:16-alpine
    container_name: exacta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exacta}
      POSTGRES_USER: ${POSTGRES_USER:-exacta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exacta} -d ${POSTGRES_DB:-exacta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: derickwai/timer-backend:latest
    container_name: exacta-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-exacta}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exacta}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      SERVER_PORT: 8080
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-ada@exacta.test}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-ExactaDemo1!}
      APP_SEED_MEMBER_PASSWORD: ${APP_SEED_MEMBER_PASSWORD:-ExactaDemo1!}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx384m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    image: derickwai/timer-frontend:latest
    container_name: exacta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
